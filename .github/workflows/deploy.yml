name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/generate-gallery-manifest.js

      - run: npm run build
        env:
          # Only the SHA-256 hash of this ever reaches the client bundle
          # (see vite.config.js). Set as a repo secret, never committed.
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Public deploy defaults to the free tier (Download as Image only).
          VITE_PRO_ENABLED: 'false'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
