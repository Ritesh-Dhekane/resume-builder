<script>
  // Apply the saved theme (light by default) before the page paints — see src/lib/theme.js.
  try {
    document.documentElement.dataset.theme =
      localStorage.getItem('resume-builder:theme') === 'dark' ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
</script>
